apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-sample
  namespace: argocd
  annotations:
    # ① 要盯的镜像；nginx 是别名，后面注解都用这个别名引用
    argocd-image-updater.argoproj.io/image-list: "nginx=ezhou2022/nginx:v1"

    # ② 更新策略：semver 跟稳定版；也可换 digest / newest-build
    argocd-image-updater.argoproj.io/nginx.update-strategy: digest

    # ③ 只接受 1.x 稳定版（生产建议 ~1.25 只允许 patch）
    #argocd-image-updater.argoproj.io/nginx.semver-constraint: ">=1.25.0"

    # ④ 过滤掉 latest / 预发布
    #argocd-image-updater.argoproj.io/nginx.allow-tags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
    #argocd-image-updater.argoproj.io/nginx.ignore-tags: "latest,dev,nightly"

    # ⑤ 写回方式：argocd = 改 Application 参数覆盖，不提交 Git（最快见效）
    #    想要纯 GitOps 审计轨迹就改成 git + git-branch + write-back-target
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ericzhou19/k8s-testing.git   # ← 换成你自己的
    targetRevision: main
    path: .                                          # ← 放 deployment.yaml 的目录
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
